name: Mihrap
options:
  bundleIdPrefix: com.mihrap
  deploymentTarget:
    iOS: "15.0"
targets:
  Mihrap:
    type: application
    platform: iOS
    sources:
      - path: Mihrap
        excludes:
          - "web/**"
      - path: Mihrap/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Mihrap
        PRODUCT_BUNDLE_IDENTIFIER: com.mihrap.app
        INFOPLIST_FILE: Mihrap/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.19"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
